[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boardinsight-backend"
version = "0.1.0"
description = "BoardInsight — API de análise de boards Businessmap (só leitura)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.159,<0.160",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "httpx>=0.28,<0.29",
    # PyMongo 4.19 validado contra o MongoDB 4.4.29 do servidor (A4).
    "pymongo>=4.19,<4.20",
    "reportlab>=5.0,<6",
    "openpyxl>=3.1,<3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "mongomock>=4.3,<5",
    # O TestClient do Starlette 1.9 usa httpx2.
    "httpx2>=2.16,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: testes contra a API Businessmap real (requer BUSINESSMAP_API_KEY)",
]
