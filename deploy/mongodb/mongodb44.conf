# MongoDB 4.4 — configuração endurecida para o BoardInsight (instalar em /etc/mongodb44.conf).
# Servidor: Atom sem AVX, 1,9 GiB RAM, eMMC. Sem backups (decisão): a app volta a recolher dados da API.

storage:
  dbPath: /var/lib/mongodb44
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      # Por omissão seria ~50% da RAM-1 GB (mínimo 256 MB); fixar para não competir com a API/worker.
      cacheSizeGB: 0.25

systemLog:
  destination: file
  path: /var/log/mongodb44/mongod.log
  logAppend: true
  # Rodado pelo logrotate (deploy/mongodb/logrotate-mongodb44) com SIGUSR1.
  logRotate: reopen

net:
  port: 27017
  # Só loopback: a API, o worker e o timer correm na mesma máquina.
  bindIp: 127.0.0.1

processManagement:
  fork: false

security:
  authorization: enabled
  # A app não usa $where/$function/mapReduce.
  javascriptEnabled: false
