# BoardInsight — site Nginx (HTTP na LAN; sem HTTPS por decisão).
# Instalar em /etc/nginx/sites-available/boardinsight e ligar em sites-enabled.

upstream boardinsight_api {
    server 127.0.0.1:8000;
    keepalive 4;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/boardinsight/frontend/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/boardinsight.access.log;
    error_log /var/log/nginx/boardinsight.error.log warn;

    location /api/ {
        proxy_pass http://boardinsight_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Downloads de exportações (XLSX/PDF) passam sem buffer em disco.
        proxy_max_temp_file_size 0;
    }

    location = /health { proxy_pass http://boardinsight_api; access_log off; }
    location = /ready  { proxy_pass http://boardinsight_api; access_log off; }

    # Ficheiros com hash do Vite: cache longa.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA: rotas do React Router caem no index.html (sem cache).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
